<g><animate attributeName="opacity" values="0.5;1;0.5;0.5" keyTimes="0.0000;0.4000;0.8000;1.0000" dur="3s" repeatCount="indefinite"/><circle cx="530" cy="198" r="11" fill="#f85149"/><text class="t w b" x="530" y="203" font-size="14" text-anchor="middle">✕</text></g>
<rect x="24" y="104" width="160" height="52" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="2"/><text class="t b" x="104" y="135" font-size="14" text-anchor="middle">Briefing agent</text>
