<circle r="4" fill="#1f6feb"><animateMotion dur="3s" begin="-0.6s" repeatCount="indefinite"><mpath href="#pb1"/></animateMotion></circle>
<path id="pb2" d="M470,130 C560,130 580,196 660,196" fill="none" stroke="#1f6feb" stroke-opacity="0.55" stroke-width="2"/>
<circle r="4" fill="#1f6feb"><animateMotion dur="3s" begin="-1.2s" repeatCount="indefinite"><mpath href="#pb2"/></animateMotion></circle>
<path id="pb3" d="M470,130 C560,130 580,244 660,244" fill="none" stroke="#1f6feb" stroke-opacity="0.55" stroke-width="2"/>
<circle r="4" fill="#1f6feb"><animateMotion dur="3s" begin="-1.7999999999999998s" repeatCount="indefinite"><mpath href="#pb3"/></animateMotion></circle>
<path id="pr3" d="M470,290 C560,290 580,244 660,244" fill="none" stroke="#238636" stroke-opacity="0.55" stroke-width="2"/>
<circle r="4" fill="#238636"><animateMotion dur="3s" begin="-2.0999999999999996s" repeatCount="indefinite"><mpath href="#pr3"/></animateMotion></circle>
<path id="pr4" d="M470,290 C560,290 580,292 660,292" fill="none" stroke="#238636" stroke-opacity="0.55" stroke-width="2"/>
<circle r="4" fill="#238636"><animateMotion dur="3s" begin="-2.8s" repeatCount="indefinite"><mpath href="#pr4"/></animateMotion></circle>
