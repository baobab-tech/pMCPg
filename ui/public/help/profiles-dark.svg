<text class="m mu" x="296" y="145" font-size="12">/p/briefing/mcp</text>
<rect x="280" y="262" width="190" height="56" rx="8" fill="#0d1117" stroke="#238636" stroke-width="2"/><text class="t b" x="296" y="285" font-size="14">Research</text>
<text class="m mu" x="296" y="305" font-size="12">/p/research/mcp</text>
<rect x="660" y="83" width="156" height="34" rx="8" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/><text class="t" x="738" y="104.5" font-size="13" text-anchor="middle">Work email</text>
<rect x="660" y="131" width="156" height="34" rx="8" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/><text class="t" x="738" y="152.5" font-size="13" text-anchor="middle">Work chat</text>
<rect x="660" y="179" width="156" height="34" rx="8" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/><text class="t" x="738" y="200.5" font-size="13" text-anchor="middle">Shared drive</text>
<rect x="660" y="227" width="156" height="34" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/><text class="t" x="738" y="248.5" font-size="13" text-anchor="middle">Notes</text>
<rect x="660" y="275" width="156" height="34" rx="8" fill="#0d1117" stroke="#238636" stroke-width="1.5"/><text class="t" x="738" y="296.5" font-size="13" text-anchor="middle">Web search</text>
<rect x="660" y="323" width="156" height="34" rx="8" fill="#0d1117" stroke="#238636" stroke-width="1.5"/><text class="t" x="738" y="344.5" font-size="13" text-anchor="middle">Papers</text>
<text class="t mu" x="850" y="248.5" font-size="11.5">← in both profiles</text>
<text class="t" x="850" y="104.5" font-size="11.5" style="fill:#f85149">← not visible</text>
<text class="t" x="850" y="120.5" font-size="11.5" style="fill:#f85149">to Research</text>
<text class="t" x="500" y="402" font-size="14" text-anchor="middle">Each agent connects to its own profile URL and sees only that profile's tools. The AI cannot switch profiles.</text>
</svg>
