<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Profiles in Private MCP Gateway</title>
<desc id="desc">The Briefing agent connects to the Briefing profile URL and sees work email, work chat, shared drive and notes. The Research agent connects to the Research profile URL and sees notes, web search and papers. The Research agent cannot reach work email.</desc>
<style>
  .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e6edf3; }
  .mu { fill: #9198a1; }
  .b { font-weight: 600; }
  .w { fill: #ffffff; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#484f58"/>
  </marker>
</defs>
<rect x="0.5" y="0.5" width="999" height="419" rx="12" fill="#0d1117" stroke="#30363d"/>
<rect x="216" y="40" width="620" height="336" rx="12" fill="#0f1d33" stroke="#4493f8" stroke-width="2"/>
<text class="t b" x="234" y="66" font-size="13" style="fill:#4493f8">Private MCP Gateway</text>
<text class="t mu" x="296" y="92" font-size="12">Profiles (one URL each)</text>
<text class="t mu" x="660" y="66" font-size="12">Accounts (signed in once)</text>
