<text class="t" x="500" y="396" font-size="15" text-anchor="middle" opacity="1"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0.0000;0.1719;0.1875;0.9844;1.0000" dur="16s" repeatCount="indefinite"/>Step 1 · The AI searches. The gateway returns only the tools that match.</text>
<text class="t" x="500" y="396" font-size="15" text-anchor="middle" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1875;0.2031;0.4281;0.4437;1.0000" dur="16s" repeatCount="indefinite"/>Step 2 · The AI calls a tool. The gateway checks your rules and adds your saved sign-in.</text>
<text class="t" x="500" y="396" font-size="15" text-anchor="middle" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4437;0.4594;0.6906;0.7063;1.0000" dur="16s" repeatCount="indefinite"/>Step 3 · The result comes back. For a cloud model, personal data is masked first.</text>
<text class="t" x="500" y="396" font-size="15" text-anchor="middle" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7063;0.7219;0.9844;1.0000" dur="16s" repeatCount="indefinite"/>Step 4 · When the AI uses [EMAIL_1], the gateway puts the real address back.</text>
