<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">How a request flows through Private MCP Gateway</title>
<desc id="desc">Animation in four steps. 1: the AI searches for a tool. 2: the AI calls the tool; the gateway checks policy and adds the saved sign-in. 3: the result contains jane@acme.org; the gateway masks it as [EMAIL_1] before the AI sees it. 4: when the AI replies to [EMAIL_1], the gateway puts jane@acme.org back before sending the call to the server.</desc>
