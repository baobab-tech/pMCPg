<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="478" viewBox="0 0 1000 478" role="img" aria-labelledby="title desc">
<title id="title">Where your data goes</title>
<desc id="desc">Your machine holds the Claude app, a coding agent, a local AI app with a local model, Private MCP Gateway and local MCP servers. The cloud holds the cloud AI model and remote MCP servers. The Claude app and coding agent send prompts and tool results to the cloud model, so personal data is masked as [EMAIL_1] first. The local AI app talks to the local model on the machine. The gateway reaches local servers over stdio and remote servers over HTTPS with OAuth.</desc>
