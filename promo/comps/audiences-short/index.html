<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>pMCPg: Three audiences</title>
<link rel="stylesheet" href="../../lib/theme.css" />
<link rel="stylesheet" href="../../lib/site.css" />
<style>
  .layout {
    position: absolute; inset: 0; display: grid;
    grid-template-rows: auto 330px 1fr; row-gap: 34px;
    grid-template-areas: "toggle" "copy" "visual";
  }
  [data-format="square"] .layout { grid-template-rows: auto 250px 1fr; row-gap: 20px; }
  [data-format="landscape"] .layout {
    grid-template-columns: 720px 1fr; grid-template-rows: auto 1fr; column-gap: 70px; row-gap: 40px;
    grid-template-areas: "toggle visual" "copy visual";
  }

  /* Audience toggle, as in the site's hero */
  .toggle {
    grid-area: toggle; justify-self: start; position: relative; display: inline-flex;
    padding: 6px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--card);
  }
  .toggle .knob { position: absolute; top: 6px; bottom: 6px; left: 0; border-radius: 999px; background: var(--brand); }
  .toggle span {
    position: relative; padding: 12px 26px; border-radius: 999px; font-size: 29px;
    color: var(--muted-fg); white-space: nowrap;
  }
  .toggle span.on { color: #0d1a20; font-weight: 600; }
  [data-format="square"] .toggle span { font-size: 28px; padding: 10px 22px; }
  [data-format="landscape"] .toggle { align-self: end; }

  .copy { grid-area: copy; position: relative; }
  .beat { position: absolute; inset: 0; opacity: 0; }
  [data-format="landscape"] .beat { top: 10px; }
  .beat h1 {
    font-family: var(--font); font-size: 76px; line-height: 1.04; font-weight: 700; letter-spacing: -1px;
    text-wrap: balance;
  }
  .beat p { margin-top: 22px; font-size: 38px; line-height: 1.35; color: var(--muted-fg); text-wrap: pretty; }
  [data-format="square"] .beat h1 { font-size: 64px; }
  [data-format="square"] .beat p { font-size: 35px; margin-top: 14px; line-height: 1.3; }
  [data-format="landscape"] .beat h1 { font-size: 78px; }
  [data-format="landscape"] .beat p { font-size: 40px; margin-top: 30px; }
  .beat p b { color: var(--fg); font-weight: 600; }

  .visual { grid-area: visual; position: relative; }
  .vis { position: absolute; left: 50%; top: 50%; opacity: 0; }
  .persp { perspective: 2200px; }
  .plane { position: absolute; inset: 0; transform-style: preserve-3d; }

  /* Beat 1: Getting started steps */
  .steps { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; width: 100%; height: 100%; }
  .step {
    border-radius: 24px; border: 2px solid var(--border); background: var(--card); padding: 26px 30px;
  }
  .step .n { font-size: 24px; font-weight: 600; letter-spacing: 0.06em; color: var(--brand); text-transform: uppercase; }
  .step h3 { font-family: var(--font); font-size: 42px; font-weight: 600; margin-top: 8px; line-height: 1.1; }
  .step p { font-size: 31px; color: var(--muted-fg); margin-top: 10px; line-height: 1.3; }

  /* Beat 2: Claude Desktop connectors, before and after */
  .win .r.bad, .bad { color: var(--warn); }
  .conn-row {
    position: absolute; left: 0; right: 0; height: 66px; display: grid; grid-template-columns: 44px 1fr auto;
    align-items: center; gap: 16px; padding: 0 24px; border-bottom: 1.5px solid var(--border); font-size: 31px;
  }
  .conn-row .t { width: 40px; height: 40px; border-radius: 9px; display: grid; place-items: center; color: #fff; font-size: 15px; font-weight: 700; }
  .conn-row .s { font-size: 26px; color: var(--muted-fg); text-align: right; }
  .conn-row .s.bad { color: var(--warn); }
  .after { position: absolute; left: 0; right: 0; padding: 24px 22px; opacity: 0; }
  .after .top { display: grid; grid-template-columns: 60px 1fr auto; gap: 16px; align-items: center; }
  .after .lg { width: 60px; height: 60px; border-radius: 14px; background: rgb(61 184 216 / 0.15); display: grid; place-items: center; box-shadow: 0 0 30px -4px var(--brand); }
  .after b { font-family: var(--font); font-size: 38px; }
  .after .sub { font-size: 25px; color: var(--muted-fg); }
  .after .ok { color: var(--ok); font-size: 25px; }
  .after .tags { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 0 76px; }
  .after .tags span { border: 1.5px solid var(--border); border-radius: 8px; padding: 3px 12px; font-size: 25px; color: var(--muted-fg); }
  .foot2 { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 22px; height: 60px; display: flex; align-items: center; font-size: 27px; }
  .ghostnote { margin-left: auto; font-size: 19px; }

  /* Beat 3: Teams, today and coming */
  .teams { display: grid; grid-template-columns: 1fr; align-content: center; gap: 22px; width: 100%; height: 100%; }
  .tcard { border-radius: 24px; background: var(--card); padding: 26px 28px; }
  .tcard.today { border: 2px solid rgb(61 184 216 / 0.45); }
  .tcard.coming { border: 2px dashed rgb(255 255 255 / 0.18); background: rgb(20 20 20 / 0.5); }
  .tcard .k { font-size: 24px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--brand); }
  .tcard.coming .k { color: var(--muted-fg); }
  .tcard ul { list-style: none; padding: 0; margin-top: 16px; display: grid; gap: 14px; }
  .tcard li { display: grid; grid-template-columns: 36px 1fr; gap: 10px; font-size: 31px; line-height: 1.25; }
  .tcard.coming li { color: var(--muted-fg); }
  .tcard li .c { color: var(--brand); }
  .tcard li .d { width: 10px; height: 10px; border-radius: 50%; background: rgb(161 161 161 / 0.5); margin: 15px 0 0 10px; }
</style>
</head>
<body>
<div class="stage">
  <div class="safe">
    <div class="layout">
      <div class="toggle" id="toggle"><div class="knob" id="knob"></div></div>
      <div class="copy" id="copy"></div>
      <div class="visual" id="visual"></div>
    </div>
  </div>
  <div class="end" id="end"></div>
</div>

<script src="../../node_modules/motion/dist/motion.js"></script>
<script type="module" src="./main.js"></script>
</body>
</html>
