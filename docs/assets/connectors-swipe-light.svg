<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">Many connectors replaced by one gateway</title>
<desc id="desc">Before: the Claude app holds seven connectors, each a URL or command with its own key, several showing expired sign-ins. A wipe sweeps across: Private MCP Gateway slots in next to Claude as its only connector, the servers move behind it, and every status turns green.</desc>
