<text class="t b" x="36" y="34" font-size="15" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5200;0.5600;0.9200;0.9500;1.0000" dur="10s" repeatCount="indefinite"/>With Private MCP Gateway: one connector, every server healthy</text>
