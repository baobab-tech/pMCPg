<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="444" viewBox="0 0 1000 444" role="img" aria-labelledby="title desc">
<title id="title">Before and after Private MCP Gateway</title>
<desc id="desc">Left: three AI apps each connect to five MCP servers, fifteen connections with keys copied into each app, and your MCP setup depends on Claude. Right: each app connects once to Private MCP Gateway, which connects to the five servers and keeps the keys in the OS keychain.</desc>
