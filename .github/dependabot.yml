# Weekly version updates, one grouped PR per folder. No CI runs on these PRs:
# run `bun run ci` locally before merging.
version: 2
updates:
  - package-ecosystem: bun
    directories: ["/", "/ui", "/website"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
